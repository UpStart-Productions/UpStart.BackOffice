<p-confirmDialog />
<p-toast position="bottom-right" />
<app-invoice-send-dialog />
<app-invoice-mark-paid-dialog />
<div class="layout-wrapper" [ngClass]="containerClass()">
  <app-topbar
    [userName]="displayName"
    [avatarUrl]="session.me()?.avatarUrl"
    (signOut)="signOut()"
  />
  <app-sidebar [navItems]="navItems()" />
  <div class="layout-main-container">
    <div class="layout-main">
      <router-outlet />
    </div>
    <app-footer />
  </div>
  <div
    class="layout-mask"
    (click)="onMaskClick()"
    role="button"
    tabindex="-1"
    aria-label="Close menu"
  ></div>
</div>
