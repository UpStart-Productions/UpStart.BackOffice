<p-confirmDialog />
<p-toast position="bottom-right" />
<app-invoice-send-dialog />
<app-invoice-mark-paid-dialog />
@if (auth.impersonatedUserId) {
  <div class="impersonation-banner" role="status">Viewing as {{ auth.impersonatedName }}. Changes you make are saved as this user.</div>
}
<div class="layout-wrapper" [ngClass]="containerClass()">
  <app-topbar />
  <app-sidebar [navItems]="navItems()" [compact]="taskMode()" />
  @if (taskMode()) {
    <app-tm-sidebar class="layout-tm-sidebar" />
  }
  <div class="layout-main-container">
    <div class="layout-main">
      <router-outlet />
    </div>
    <app-footer />
  </div>
  <div
    class="layout-mask"
    (click)="onMaskClick()"
    role="button"
    tabindex="-1"
    aria-label="Close menu"
  ></div>
  <app-help-agent-widget />
</div>
