<app-page title="Invoices" [skipTitle]="true">
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  }
  <div class="card">
    <h2 class="page-title page-title-in-card">Invoices</h2>
    <div class="toolbar">
      <a pButton label="New Invoice" icon="pi pi-plus" routerLink="/invoices/new"></a>
      <div class="toolbar-search">
        <p-iconfield iconPosition="left" class="toolbar-search-field">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input
            pInputText
            type="text"
            class="w-full"
            placeholder="Search by number, client, status…"
            [ngModel]="searchQuery"
            (ngModelChange)="onSearchInput($event)"
          />
        </p-iconfield>
        @if (searchQuery) {
          <button
            type="button"
            pButton
            icon="pi pi-times"
            [text]="true"
            (click)="clearSearch()"
            aria-label="Clear search"
          ></button>
        }
      </div>
    </div>
    <p-table
      [value]="filteredInvoices()"
      [loading]="loading()"
      sortField="number"
      [sortOrder]="-1"
      styleClass="table-bordered"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th pSortableColumn="number">
            Number
            <p-sortIcon field="number" />
          </th>
          <th pSortableColumn="client.name">
            Client
            <p-sortIcon field="client.name" />
          </th>
          <th pSortableColumn="issueDate">
            Issue Date
            <p-sortIcon field="issueDate" />
          </th>
          <th pSortableColumn="dueDate">
            Due Date
            <p-sortIcon field="dueDate" />
          </th>
          <th pSortableColumn="total">
            Total
            <p-sortIcon field="total" />
          </th>
          <th pSortableColumn="status">
            Status
            <p-sortIcon field="status" />
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-inv>
        <tr>
          <td>
            <app-row-actions-menu [items]="getRowActions(inv)" ariaLabel="Invoice actions" />
          </td>
          <td>
            <a
              [routerLink]="inv.status === 'DRAFT' ? ['/invoices', inv.id, 'edit'] : ['/invoices', inv.id]"
              class="text-primary font-semibold"
            >{{ inv.displayNumber }}</a>
          </td>
          <td>{{ inv.client.name }}</td>
          <td>{{ formatDate(inv.issueDate) }}</td>
          <td>{{ inv.dueDate ? formatDate(inv.dueDate) : '—' }}</td>
          <td>{{ formatAmount(inv.total) }}</td>
          <td>
            <p-tag [value]="inv.status" [severity]="statusSeverity(inv.status)" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-page>
