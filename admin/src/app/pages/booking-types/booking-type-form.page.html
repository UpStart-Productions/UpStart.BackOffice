<app-page
  [title]="id() ? 'Edit Booking Type' : 'New Booking Type'"
  backLink="/bookings/types"
  backLabel="Back to booking types"
>
  <ng-container ngProjectAs="[pageActions]">
    @if (!loading()) {
      @if (id() && bookingCount() === 0) {
        <app-row-actions-menu [items]="headerActions" ariaLabel="Booking type actions" />
      }
      <p-button
        label="Save"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="!!id() && !isDirty()"
        (click)="save()"
      />
    }
  </ng-container>
  <ng-container ngProjectAs="[pageTitleTrail]">
    @if (id()) {
      <app-record-attribution [attribution]="attribution()" />
    }
  </ng-container>
  @if (error()) {
    <div class="card mb-3">
      <p-message severity="error" [text]="error()!" />
    </div>
  }

  @if (loading()) {
    <div class="card">
      <p class="text-color-secondary mb-0">Loading…</p>
    </div>
  } @else {
    <div class="card mb-3">
      <h2 class="card-title mb-3">Basics</h2>
      <div class="showcase-flex-col">
        <div class="form-field showcase-full">
          <label for="btName">Name</label>
          <input pInputText id="btName" class="w-full" [(ngModel)]="form.name" name="btName" />
        </div>
        <div class="form-field showcase-full">
          <label for="btSlug">Slug <app-help-text key="bookingType.slug" /></label>
          <input
            pInputText
            id="btSlug"
            class="w-full"
            [(ngModel)]="form.slug"
            name="btSlug"
            placeholder="upstart-discovery"
            [disabled]="!!id() && bookingCount() > 0"
          />
        </div>
        <div class="form-field showcase-full">
          <label for="btBrand">Brand (optional) <app-help-text key="bookingType.brand" /></label>
          <input pInputText id="btBrand" class="w-full" [(ngModel)]="form.brand" name="btBrand" placeholder="UpStart" />
        </div>
        <div class="form-field showcase-full">
          <label for="btHost">Host</label>
          <p-select
            inputId="btHost"
            [options]="hostOptions()"
            optionLabel="label"
            optionValue="id"
            [(ngModel)]="form.hostUserId"
            name="btHost"
            placeholder="Select host"
            styleClass="w-full"
          />
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <h2 class="card-title mb-3">Schedule</h2>
      <div class="form-fields-4 mb-4">
        <div class="form-field">
          <label for="btDuration">Duration (minutes)</label>
          <input pInputText id="btDuration" type="number" class="w-full" [(ngModel)]="form.durationMin" name="btDuration" />
        </div>
        <div class="form-field">
          <label for="btNotice">Minimum notice (hours) <app-help-text key="bookingType.minimumNotice" /></label>
          <input pInputText id="btNotice" type="number" class="w-full" [(ngModel)]="form.minNoticeHours" name="btNotice" />
        </div>
        <div class="form-field">
          <label for="btHorizon">How far ahead (days) <app-help-text key="bookingType.horizon" /></label>
          <input pInputText id="btHorizon" type="number" class="w-full" [(ngModel)]="form.maxDaysAhead" name="btHorizon" />
        </div>
        <div class="form-field">
          <label for="btTimezone">Timezone</label>
          <p-select
            inputId="btTimezone"
            [options]="timezoneOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="form.timezone"
            name="btTimezone"
            styleClass="w-full"
          />
        </div>
      </div>

      <p-table [value]="days" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>Day</th>
            <th>Available</th>
            <th>Start</th>
            <th>End</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-day>
          <tr>
            <td>{{ day.label }}</td>
            <td>
              <input type="checkbox" [(ngModel)]="day.enabled" [name]="'day-' + day.dayOfWeek" />
            </td>
            <td>
              <input pInputText type="time" class="w-full" [(ngModel)]="day.startTime" [disabled]="!day.enabled" [name]="'start-' + day.dayOfWeek" />
            </td>
            <td>
              <input pInputText type="time" class="w-full" [(ngModel)]="day.endTime" [disabled]="!day.enabled" [name]="'end-' + day.dayOfWeek" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="card mb-3">
      <h2 class="card-title mb-3">Public page &amp; calendar</h2>
      <div class="showcase-flex">
        <div class="form-field showcase-half">
          <label for="btPublicUrl">Public booking page URL <app-help-text key="bookingType.publicPageUrl" /></label>
          <input pInputText id="btPublicUrl" type="url" class="w-full" [(ngModel)]="form.publicPageUrl" name="btPublicUrl" />
        </div>
        <div class="form-field showcase-half">
          <label for="btEventTitle">Google Calendar event title</label>
          <input pInputText id="btEventTitle" class="w-full" [(ngModel)]="form.calendarEventTitle" name="btEventTitle" />
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <h2 class="card-title mb-3">Pipeline</h2>
      <div class="showcase-flex-col">
        <div class="form-field flex align-items-center gap-2">
          <p-toggleSwitch [(ngModel)]="form.createLead" name="btCreateLead" inputId="btCreateLead" />
          <label for="btCreateLead">Create or update pipeline lead on booking</label>
        </div>
        @if (form.createLead) {
          <div class="showcase-flex">
            <div class="form-field showcase-half">
              <label for="btLeadStage">Pipeline lane <app-help-text key="bookingType.pipelineLane" /></label>
              <p-select
                inputId="btLeadStage"
                [options]="laneOptions()"
                optionLabel="label"
                optionValue="value"
                [(ngModel)]="form.leadStageId"
                name="btLeadStage"
                placeholder="First lane"
                [showClear]="true"
                styleClass="w-full"
              />
            </div>
            <div class="form-field showcase-half">
              <label for="btLeadSource">Lead source <app-help-text key="bookingType.leadSource" /></label>
              <p-select inputId="btLeadSource" [options]="leadSources" [(ngModel)]="form.leadSource" name="btLeadSource" styleClass="w-full" />
            </div>
            <div class="form-field showcase-half">
              <label for="btNoteTitle">Pipeline note title prefix <app-help-text key="bookingType.noteTitle" /></label>
              <input pInputText id="btNoteTitle" class="w-full" [(ngModel)]="form.pipelineNoteTitle" name="btNoteTitle" placeholder="Discovery call" />
            </div>
          </div>
        }
      </div>
    </div>

    <div class="card mb-3">
      <h2 class="card-title mb-3">Pricing <app-help-text key="bookingType.pricing" /></h2>
      <div class="form-field project-rate-row">
        <label for="btPrice">Price</label>
        <div class="project-rate-controls">
          <div class="project-rate-toggles">
            <div class="flex align-items-center gap-2">
              <p-toggleSwitch
                [(ngModel)]="form.isBillable"
                name="btBillable"
                inputId="btBillable"
                (ngModelChange)="onBillableChange($event)"
              />
              <label for="btBillable">Billable</label>
            </div>
          </div>
          <app-money-input
            inputId="btPrice"
            name="btPrice"
            [(ngModel)]="form.priceDollars"
            [min]="0"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [disabled]="!form.isBillable"
            styleClass="project-rate-input"
            inputStyleClass="project-rate-input-field"
          />
          <div class="project-rate-toggles">
            <div class="flex align-items-center gap-2">
              <p-toggleSwitch [(ngModel)]="form.paymentRequired" name="btPayment" inputId="btPayment" />
              <label for="btPayment">Require payment</label>
            </div>
          </div>
        </div>
      </div>
    </div>

  }
</app-page>
