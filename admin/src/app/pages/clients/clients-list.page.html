<app-page title="Clients" [skipTitle]="true">
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  }
  <div class="card">
    <h2 class="page-title page-title-in-card">Clients</h2>
    <div class="toolbar">
      @if (canCreate()) {
        <a pButton label="New Client" icon="pi pi-plus" routerLink="/organizations/new" [queryParams]="{ type: 'client', from: 'clients' }"></a>
      }
      <label class="flex align-items-center gap-2" for="includePast">
        <p-toggleswitch inputId="includePast" [ngModel]="includePast()" (ngModelChange)="onIncludePast($event)" />
        <span>Include past clients</span>
      </label>
      <div class="toolbar-search">
        <p-iconfield iconPosition="left" class="toolbar-search-field">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input
            pInputText
            type="text"
            class="w-full"
            placeholder="Search by name, code, email…"
            aria-label="Search clients"
            [ngModel]="searchQuery"
            (ngModelChange)="onSearchInput($event)"
          />
        </p-iconfield>
        @if (searchQuery) {
          <button type="button" pButton icon="pi pi-times" [text]="true" (click)="clearSearch()" aria-label="Clear search"></button>
        }
      </div>
    </div>
    <p-table [value]="filteredClients()" [loading]="loading()" sortField="name" [sortOrder]="1" styleClass="table-bordered">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Code</th>
          <th>Email</th>
          <th pSortableColumn="lastContactAt">Last contact <p-sortIcon field="lastContactAt" /></th>
          <th pSortableColumn="journey">Status <p-sortIcon field="journey" /></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-client>
        <tr>
          <td><app-row-actions-menu [items]="getRowActions(client)" ariaLabel="Client actions" /></td>
          <td>
            <a [routerLink]="['/clients', client.id]" class="text-primary">{{ client.name }}</a>
          </td>
          <td>@if (client.code) { <code>{{ client.code }}</code> }</td>
          <td><app-copy-email [email]="client.email" /></td>
          <td>{{ lastContactLabel(client.lastContactAt) }}</td>
          <td>
            @if (client.journey === 'PAST_CLIENT') {
              <p-tag value="Past client" severity="secondary" />
            } @else {
              <p-tag [value]="client.isActive ? 'Active' : 'Inactive'" [severity]="client.isActive ? 'success' : 'secondary'" />
            }
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-page>
