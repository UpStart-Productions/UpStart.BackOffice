<app-page title="Clients">
  @if (canCreate()) {
    <a pageActions pButton label="New Client" icon="pi pi-plus" routerLink="/organizations/new" [queryParams]="{ type: 'client', from: 'clients' }"></a>
  }
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  }
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-search">
        <app-toolbar-search-field
          placeholder="Search by name, code, email…"
          ariaLabel="Search clients"
          [ngModel]="searchQuery"
          (ngModelChange)="onSearchInput($event)"
        />
      </div>
    </div>
    <p-table
      [value]="filteredClients()"
      [loading]="loading()"
      [sortField]="tableSortField()"
      [sortOrder]="tableSortOrder()"
      (onSort)="onTableSort($event)"
      styleClass="table-bordered"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Code</th>
          <th>Email</th>
          <th pSortableColumn="lastContactAt">Last contact <p-sortIcon field="lastContactAt" /></th>
          <th pSortableColumn="journey">Status <p-sortIcon field="journey" /></th>
          <th>Tags</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-client>
        <tr>
          <td><app-row-actions-menu [items]="getRowActions(client)" ariaLabel="Client actions" /></td>
          <td>
            <a [routerLink]="['/clients', client.id]" class="text-primary">{{ client.name }}</a>
          </td>
          <td>@if (client.code) { <code>{{ client.code }}</code> }</td>
          <td><app-copy-email [email]="client.email" /></td>
          <td>{{ lastContactLabel(client.lastContactAt) }}</td>
          <td>
            <p-tag [value]="client.isActive ? 'Active' : 'Inactive'" [severity]="client.isActive ? 'success' : 'secondary'" />
          </td>
          <td>
            <app-tag-chip-list
              [tags]="client.tags"
              [removable]="canEdit()"
              (removeTag)="removeTag(client, $event)"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-page>
