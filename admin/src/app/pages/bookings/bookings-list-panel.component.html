@if (error()) {
  <div class="mb-3">
    <p-message severity="error" [text]="error()!" />
  </div>
}

<p-table
    [value]="tableRows()"
    [loading]="loading()"
    [sortField]="tableSortField()"
    [sortOrder]="tableSortOrder()"
    (onSort)="onTableSort($event)"
    styleClass="table-bordered"
    [paginator]="tableRows().length > 50"
    [rows]="50"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem"></th>
        <th pSortableColumn="startAt">When <p-sortIcon field="startAt" /></th>
        <th pSortableColumn="typeSort">Type <p-sortIcon field="typeSort" /></th>
        <th pSortableColumn="guestName">Guest <p-sortIcon field="guestName" /></th>
        <th pSortableColumn="guestOrgSort">Organization <p-sortIcon field="guestOrgSort" /></th>
        <th pSortableColumn="status">Status <p-sortIcon field="status" /></th>
        <th pSortableColumn="leadSort">Lead <p-sortIcon field="leadSort" /></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <app-row-actions-menu [items]="getRowActions(row)" ariaLabel="Booking actions" />
        </td>
        <td>{{ formatWhen(row.startAt) }}</td>
        <td>{{ row.bookingType?.name }}</td>
        <td>
          <div>{{ row.guestName }}</div>
          <div class="text-color-secondary text-sm">{{ row.guestEmail }}</div>
        </td>
        <td>{{ row.guestOrg }}</td>
        <td>
          <p-tag [value]="row.status" [severity]="statusSeverity(row.status)" />
        </td>
        <td>
          @if (row.lead) {
            <a [routerLink]="['/pipeline', row.lead.id]">{{ row.lead.organization }}</a>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
      </tr>
    </ng-template>
</p-table>
