<h2 class="page-title">{{ isNew ? 'New Project' : 'Edit Project' }}</h2>
@if (error()) { <p-message severity="error" [text]="error()!" styleClass="mb-3" /> }

@if (!loading()) {
  <div class="card" style="max-width: 560px">
    <div class="flex flex-col gap-3">
      <div class="field">
        <label>Client *</label>
        <p-select [options]="clients()" optionLabel="name" optionValue="id"
          [(ngModel)]="form.clientId" placeholder="Select client" styleClass="w-full" />
      </div>
      <div class="field">
        <label>Project Name *</label>
        <input pInputText [(ngModel)]="form.name" class="w-full" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea pTextarea [(ngModel)]="form.description" class="w-full" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Hourly Rate (optional override)</label>
        <input pInputText type="number" [(ngModel)]="form.hourlyRate" class="w-full" placeholder="e.g. 150" />
      </div>
      <div class="flex gap-4">
        <div class="flex align-items-center gap-2">
          <p-toggleSwitch [(ngModel)]="form.isBillable" />
          <label>Billable</label>
        </div>
        <div class="flex align-items-center gap-2">
          <p-toggleSwitch [(ngModel)]="form.isActive" />
          <label>Active</label>
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-4">
      <a routerLink="/projects"><p-button label="Cancel" severity="secondary" /></a>
      <p-button label="Save" [loading]="saving()" (click)="save()" />
    </div>
  </div>
}
