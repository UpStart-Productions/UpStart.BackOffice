<app-page [title]="isNew ? 'New Project' : 'Edit Project'" [skipTitle]="true">
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  } @else if (!loading()) {
    <form class="card" (ngSubmit)="save()">
      <div class="page-header-with-back">
        <p-button
          icon="pi pi-arrow-left"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          type="button"
          routerLink="/projects"
          aria-label="Back to Projects"
        />
        <h2 class="page-title page-title-in-card mb-0">
          {{ isNew ? 'New Project' : 'Edit Project' }}
        </h2>
      </div>

      <div class="showcase-flex-col">
        <div class="form-field showcase-full">
          <label for="clientId">Client <span class="required-dot" aria-hidden="true"></span></label>
          <p-select
            inputId="clientId"
            [options]="clients()"
            optionLabel="name"
            optionValue="id"
            [(ngModel)]="form.clientId"
            name="clientId"
            placeholder="Select client"
            styleClass="w-full"
          />
        </div>
        <div class="form-field showcase-full">
          <label for="name">Project Name <span class="required-dot" aria-hidden="true"></span></label>
          <input pInputText id="name" name="name" [(ngModel)]="form.name" class="w-full" />
        </div>
        <div class="form-field showcase-full">
          <label for="description">Description</label>
          <textarea
            pTextarea
            id="description"
            name="description"
            [(ngModel)]="form.description"
            class="w-full"
            rows="3"
          ></textarea>
        </div>
        <div class="form-field showcase-full">
          <label for="hourlyRate">Hourly Rate (optional override)</label>
          <input
            pInputText
            id="hourlyRate"
            name="hourlyRate"
            type="number"
            [(ngModel)]="form.hourlyRate"
            class="w-full"
            placeholder="e.g. 150"
          />
        </div>
        <div class="showcase-row">
          <div class="flex align-items-center gap-2">
            <p-toggleSwitch [(ngModel)]="form.isBillable" name="isBillable" />
            <label>Billable</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-toggleSwitch [(ngModel)]="form.isActive" name="isActive" />
            <label>Active</label>
          </div>
        </div>

        <div class="tasks-section">
          <div class="form-field">
            <h3 class="showcase-section-title mb-1">Tasks</h3>
          <p class="text-color-secondary mt-0 mb-3 text-sm">
            Billable and non-billable tasks for timesheet entries on this project.
          </p>

          <p-table [value]="tasks()" styleClass="table-bordered">
            <ng-template pTemplate="header">
              <tr>
                <th>Task name</th>
                <th style="width: 8rem">Billable</th>
                <th style="width: 3rem"></th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-task let-rowIndex="rowIndex">
              <tr>
                <td>
                  <input
                    pInputText
                    [(ngModel)]="task.name"
                    [name]="'task-name-' + rowIndex"
                    class="w-full"
                    placeholder="e.g. Development"
                  />
                </td>
                <td>
                  <p-toggleSwitch
                    [(ngModel)]="task.isBillable"
                    [name]="'task-billable-' + rowIndex"
                  />
                </td>
                <td>
                  <button
                    type="button"
                    pButton
                    icon="pi pi-trash"
                    severity="danger"
                    [text]="true"
                    (click)="removeTask(rowIndex)"
                    aria-label="Remove task"
                  ></button>
                </td>
              </tr>
            </ng-template>
          </p-table>

          <button
            type="button"
            pButton
            label="+ Add task"
            [text]="true"
            severity="secondary"
            class="mt-2 p-0"
            (click)="addTask()"
          ></button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a pButton label="Cancel" class="p-button-secondary" routerLink="/projects"></a>
        <button pButton type="submit" label="Save" [loading]="saving()"></button>
      </div>
    </form>
  }
</app-page>
