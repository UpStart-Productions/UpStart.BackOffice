<app-page title="Projects">
  <a pageActions pButton label="New Project" icon="pi pi-plus" routerLink="/projects/new"></a>
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  }
  <div class="card">
    <div class="toolbar">
      <div class="projects-list-toolbar-end">
        <div class="toolbar-search">
          <app-toolbar-search-field
            placeholder="Search by project, client…"
            ariaLabel="Search projects"
            [ngModel]="searchQuery"
            (ngModelChange)="onSearchInput($event)"
          />
        </div>
        <label class="projects-list-inactive-toggle" for="projectsShowInactive">
          <span>Show inactive projects</span>
          <p-toggleSwitch
            inputId="projectsShowInactive"
            [ngModel]="showInactive()"
            (ngModelChange)="setShowInactive($event)"
          />
        </label>
      </div>
    </div>
    <p-table
      [value]="filteredProjects()"
      [loading]="loading()"
      [sortField]="tableSortField()"
      [sortOrder]="tableSortOrder()"
      (onSort)="onTableSort($event)"
      styleClass="table-bordered"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th pSortableColumn="name">
            Name
            <p-sortIcon field="name" />
          </th>
          <th pSortableColumn="client.name">
            Client
            <p-sortIcon field="client.name" />
          </th>
          <th class="col-numeric" pSortableColumn="hourlyRate">
            Rate
            <p-sortIcon field="hourlyRate" />
          </th>
          <th pSortableColumn="isBillable">
            Billable
            <p-sortIcon field="isBillable" />
          </th>
          <th pSortableColumn="isActive">
            Status
            <p-sortIcon field="isActive" />
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-project>
        <tr>
          <td>
            <app-row-actions-menu [items]="getRowActions(project)" ariaLabel="Project actions" />
          </td>
          <td>
            <a [routerLink]="['/projects', project.id]" class="text-primary">{{ project.name }}</a>
          </td>
          <td>{{ (project.client?.name ?? 'Personal') }}</td>
          <td class="col-numeric">{{ project.hourlyRate ? ('$' + project.hourlyRate + '/hr') : '' }}</td>
          <td>
            <i
              class="pi"
              [class.pi-check-circle]="project.isBillable"
              [class.pi-circle]="!project.isBillable"
            ></i>
          </td>
          <td>
            <p-tag
              [value]="project.isActive ? 'Active' : 'Inactive'"
              [severity]="project.isActive ? 'success' : 'secondary'"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        @if (firstRunEmpty()) {
          <app-empty-state
            shape="table-rows"
            [columns]="ghostColumns"
            title="Start your first project"
            body="Projects group the time, tasks and billing for work you do for an account."
            actionLabel="New Project"
            actionLink="/projects/new"
          />
        } @else if (!loading()) {
          <tr>
            <td colspan="6" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
          </tr>
        }
      </ng-template>
    </p-table>
  </div>
</app-page>
