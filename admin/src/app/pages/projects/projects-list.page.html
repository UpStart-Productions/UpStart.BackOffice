<app-page title="Projects" [skipTitle]="true">
  @if (error()) {
    <div class="card">
      <p-message severity="error" [text]="error()!" />
    </div>
  }
  <div class="card">
    <h2 class="page-title page-title-in-card">Projects</h2>
    <div class="toolbar">
      <a pButton label="New Project" icon="pi pi-plus" routerLink="/projects/new"></a>
      <div class="toolbar-search">
        <p-iconfield iconPosition="left" class="toolbar-search-field">
          <p-inputicon><i class="pi pi-search"></i></p-inputicon>
          <input
            pInputText
            type="text"
            class="w-full"
            placeholder="Search by project, client…"
            [ngModel]="searchQuery"
            (ngModelChange)="onSearchInput($event)"
          />
        </p-iconfield>
        @if (searchQuery) {
          <button
            type="button"
            pButton
            icon="pi pi-times"
            [text]="true"
            (click)="clearSearch()"
            aria-label="Clear search"
          ></button>
        }
      </div>
    </div>
    <p-table
      [value]="filteredProjects()"
      [loading]="loading()"
      sortField="name"
      [sortOrder]="1"
      styleClass="table-bordered"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th pSortableColumn="name">
            Name
            <p-sortIcon field="name" />
          </th>
          <th pSortableColumn="client.name">
            Client
            <p-sortIcon field="client.name" />
          </th>
          <th pSortableColumn="hourlyRate">
            Rate
            <p-sortIcon field="hourlyRate" />
          </th>
          <th pSortableColumn="isBillable">
            Billable
            <p-sortIcon field="isBillable" />
          </th>
          <th pSortableColumn="isActive">
            Status
            <p-sortIcon field="isActive" />
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-project>
        <tr>
          <td>
            <app-row-actions-menu [items]="getRowActions(project)" ariaLabel="Project actions" />
          </td>
          <td>
            <a [routerLink]="['/projects', project.id]" class="text-primary">{{ project.name }}</a>
          </td>
          <td>{{ project.client.name }}</td>
          <td>{{ project.hourlyRate ? ('$' + project.hourlyRate + '/hr') : '—' }}</td>
          <td>
            <i
              class="pi"
              [class.pi-check-circle]="project.isBillable"
              [class.pi-circle]="!project.isBillable"
            ></i>
          </td>
          <td>
            <p-tag
              [value]="project.isActive ? 'Active' : 'Inactive'"
              [severity]="project.isActive ? 'success' : 'secondary'"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4 text-color-secondary">{{ emptyMessage() }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-page>
