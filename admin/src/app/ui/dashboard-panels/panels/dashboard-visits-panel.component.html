<app-dashboard-panel title="My visits" icon="pi-calendar-clock" [color]="panelColor('visits')" link="/schedule" [fill]="true">
  @if (store.visits().loading) {
    <p class="side-list-empty"><i class="pi pi-spin pi-spinner mr-2"></i>Loading…</p>
  } @else if (store.visits().error) {
    <p class="side-list-empty">{{ store.visits().error }}</p>
  } @else if (store.myVisits().length) {
    @for (v of store.myVisits(); track v.id) {
      <app-record-card
        variant="compact"
        [singleLine]="true"
        [title]="v.clientName"
        [subtitle]="v.visitType.name + ' · ' + store.visitWhen(v)"
        [clickable]="true"
        (titleClick)="store.openVisit(v.id)"
        icon="house"
        tone="success"
      >
        <ng-container ngProjectAs="[recordActions]">
          <p-button label="Open visit" size="small" severity="secondary" [outlined]="true" (onClick)="store.openVisit(v.id)" />
        </ng-container>
      </app-record-card>
    }
  } @else {
    <p class="dashboard-quiet">No visits in the next week.</p>
  }
</app-dashboard-panel>
