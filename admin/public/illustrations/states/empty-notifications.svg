<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Notifications"><title>Notifications</title><style>
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(2px,-3px)}70%{transform:translate(-2px,2px)}}
@keyframes drift-small{0%,100%{transform:translate(0,0)}30%{transform:translate(.5px,-.7px)}70%{transform:translate(-.5px,.5px)}}
@keyframes drop{0%{opacity:0;transform:translateY(-52px)}75%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
.drift{animation:drift 4200ms 1700ms ease-in-out 2 both;transform-box:fill-box;transform-origin:center}
.drift-small{animation:drift-small 4200ms 1300ms ease-in-out 2 both;transform-box:fill-box;transform-origin:center}
.drop{animation:drop var(--duration,800ms) var(--delay,900ms) cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes reveal{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes grow{0%{opacity:0;transform:scale(.65)}80%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1)}}
@keyframes trace{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
@keyframes turn{from{opacity:0;transform:rotate(-32deg)}to{opacity:1;transform:rotate(0)}}
@keyframes swing{0%{transform:rotate(-8deg);opacity:0}55%{transform:rotate(4deg);opacity:1}80%{transform:rotate(-1deg)}100%{transform:rotate(0);opacity:1}}
@keyframes scan{0%{transform:translate(-6px,4px);opacity:0}35%{transform:translate(2px,-2px);opacity:1}70%{transform:translate(-2px,0);opacity:1}100%{transform:translate(0,0);opacity:1}}
.appear,.rise,.slide,.reveal,.grow,.turn,.swing,.scan,.trace{animation-duration:var(--duration,650ms);animation-delay:var(--delay,0ms);animation-fill-mode:both;animation-iteration-count:1;animation-timing-function:cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
.appear{animation-name:appear}.rise{animation-name:rise}.slide{animation-name:slide}.reveal{animation-name:reveal;transform-origin:left center}.grow{animation-name:grow}.turn{animation-name:turn}.swing{animation-name:swing;transform-origin:center top}.scan{animation-name:scan}.trace{animation-name:trace;stroke-dasharray:1;stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){.drift,.drift-small,.drop,.appear,.rise,.slide,.reveal,.grow,.turn,.swing,.scan,.trace{animation:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style><g stroke-linecap="round" stroke-linejoin="round"><g class="appear" style="--delay:0ms;--duration:400ms"><path d="M62 169C36 144 43 113 65 98C86 84 87 54 117 45C147 35 166 56 187 51C222 42 253 61 264 87C277 117 259 138 267 162C278 195 246 216 213 212C181 208 163 220 136 210C110 200 84 191 62 169Z" fill="#EDE8FC"/></g><g class="swing" style="--delay:280ms;--duration:1500ms"><path d="M117 151V112Q117 75 153 75Q189 75 189 112V151L201 165H105Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="1.5"/><path d="M153 63V75" fill="none" stroke="#7C5CE7" stroke-width="4"/><path d="M139 176Q153 192 167 176" fill="#BCE5D8" stroke="#4C1D95" stroke-width="1.5"/></g><path d="M208 95Q220 115 212 133" fill="none" stroke="#C9D4E6" stroke-width="2" class="trace" style="--delay:1350ms;--duration:650ms" pathLength="1"/><g class="grow" style="--delay:2100ms;--duration:480ms"><path d="M264 94Q265 100 271 101Q265 102 264 108Q263 102 257 101Q263 100 264 94Z" fill="#B6A3F1" stroke="#4C1D95" stroke-width="1.2"/></g><g class="appear" style="--delay:1800ms;--duration:300ms"><circle cx="76" cy="161" r="3" fill="#BCE5D8"/></g><g data-part="extra-accents"><g data-extra-star="true" class="grow" style="--delay:1850ms;--duration:500ms"><path d="M64 95.5Q65 99 68.5 100Q65 101 64 104.5Q63 101 59.5 100Q63 99 64 95.5Z" fill="#B6A3F1" stroke="#4C1D95" stroke-width="1.2"/></g><g data-extra-star="true" class="grow" style="--delay:2200ms;--duration:500ms"><path d="M262 198Q263 201 266 202Q263 203 262 206Q261 203 258 202Q261 201 262 198Z" fill="#B6A3F1" stroke="#4C1D95" stroke-width="1.2"/></g><g data-extra-dot="true" class="appear" style="--delay:1300ms;--duration:350ms"><circle cx="87" cy="59" r="2.5" fill="#BCE5D8"/></g><g data-extra-dot="true" class="appear" style="--delay:1600ms;--duration:350ms"><circle cx="249" cy="69" r="2" fill="#C9D4E6"/></g></g></g></svg>