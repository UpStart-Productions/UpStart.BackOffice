00ms"><circle cx="76" cy="161" r="3" fill="#BCE5D8"/></g><g data-part="extra-accents"><g data-extra-star="true" class="grow" style="--delay:1850ms;--duration:500ms"><path d="M64 95.5Q65 99 68.5 100Q65 101 64 104.5Q63 101 59.5 100Q63 99 64 95.5Z" fill="#B6A3F1" stroke="#4C1D95" stroke-width="1.2"/></g><g data-extra-star="true" class="grow" style="--delay:2200ms;--duration:500ms"><path d="M262 198Q263 201 266 202Q263 203 262 206Q261 203 258 202Q261 201 262 198Z" fill="#B6A3F1" stroke="#4C1D95" stroke-width="1.2"/></g><g data-extra-dot="true" class="appear" style="--delay:1300ms;--duration:350ms"><circle cx="87" cy="59" r="2.5" fill="#BCE5D8"/></g><g data-extra-dot="true" class="appear" style="--delay:1600ms;--duration:350ms"><circle cx="249" cy="69" r="2" fill="#C9D4E6"/></g></g></g></svg>