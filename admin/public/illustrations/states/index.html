  <style>
    #upstart-library-gallery{color-scheme:light dark;font:14px system-ui,sans-serif;color:light-dark(#28334a,#eeeaf9);--up-surface:light-dark(#fff,#242132);--up-line:light-dark(#e5e7ed,#454052);--up-muted:light-dark(#647084,#c0b8ce);--up-accent:light-dark(#6348bd,#d6c6ff)}
    #upstart-library-gallery .up-heading{margin:0 0 16px;font-size:20px;font-weight:500}
    #upstart-library-gallery .up-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-right:90px}
    #upstart-library-gallery select{max-width:100%;min-width:0;font:inherit;color:inherit;background:var(--up-surface);border:1px solid var(--up-line);border-radius:7px;padding:9px 12px}
    #upstart-library-gallery button{font:inherit;color:inherit;background:var(--up-surface);border:1px solid var(--up-line);border-radius:7px;padding:9px 15px;cursor:pointer}
    #upstart-library-gallery button:focus-visible,#upstart-library-gallery select:focus-visible{outline:2px solid var(--up-accent);outline-offset:3px}
    #upstart-library-gallery .up-stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--up-surface);border:1px solid var(--up-line);border-radius:14px;padding:18px}
    #upstart-library-gallery .up-large{width:100%;max-height:270px;object-fit:contain;aspect-ratio:4/3}
    #upstart-library-gallery h3{font-size:17px;font-weight:500;margin:0 0 8px}
    #upstart-library-gallery p{margin:0 0 12px;color:var(--up-muted);line-height:1.5}
    #upstart-library-gallery .up-smalls{display:flex;align-items:center;gap:20px;margin:20px 0}
    #upstart-library-gallery .up-size{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;color:var(--up-muted)}
    #upstart-library-gallery .up-size span{min-height:48px;display:flex;align-items:center}
    #upstart-library-gallery .up-size img{display:block}
    #upstart-library-gallery .up-thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px}
    #upstart-library-gallery .up-thumb{padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font-size:12px;line-height:1.3}
    #upstart-library-gallery .up-thumb img{width:100%;height:auto;aspect-ratio:4/3}
    #upstart-library-gallery .up-thumb[aria-pressed="true"]{border-color:var(--up-accent);background:light-dark(#f4f0ff,#383044)}
    #upstart-library-gallery .up-uses{font-size:12px;margin-top:8px}
    @media(max-width:560px){#upstart-library-gallery .up-stage{grid-template-columns:1fr;gap:4px}#upstart-library-gallery .up-large{max-height:220px}#upstart-library-gallery .up-thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}#upstart-library-gallery .up-controls{padding-right:0}}

  <script>
  (()=>{
    const root=document.getElementById('upstart-library-gallery');
    const catalog=JSON.parse(root.querySelector('[data-catalog]').textContent);
    const select=root.querySelector('select');
    const large=root.querySelector('.up-large');
    const smalls=[...root.querySelectorAll('.up-size img')];
    const thumbs=root.querySelector('.up-thumbs');
    const encode=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
    let current=catalog[0],replay=0;
    const saved=window.openai?.widgetState;
    const savedId=saved?.modelContent?.selectedState??saved?.selectedState;
    if(catalog.some(a=>a.id===savedId))current=catalog.find(a=>a.id===savedId);
    const groups=new Map();
    for(const a of catalog){
      if(!groups.has(a.category)){const g=document.createElement('optgroup');g.label=a.category;groups.set(a.category,g);select.append(g)}
      const o=document.createElement('option');o.value=a.id;o.textContent=a.title;groups.get(a.category).append(o);
      const b=document.createElement('button');b.type='button';b.className='up-thumb';b.dataset.id=a.id;b.setAttribute('aria-pressed','false');
      const img=document.createElement('img');img.src=encode(a.static);img.alt='';
      const text=document.createElement('span');text.textContent=a.title;b.append(img,text);thumbs.append(b);
      b.addEventListener('click',()=>choose(a.id,true));
    }
    function play(){
      replay++;
      const unique='<!-- replay '+replay+' -->';
      large.src=encode(current.svg.replace('</svg>',unique+'</svg>'));
      smalls.forEach((img,i)=>img.src=encode(current.compactSvg.replace('</svg>','<!-- size '+i+' -->'+unique+'</svg>')));
    }
    function choose(id,save){
      const a=catalog.find(a=>a.id===id);if(!a)return;current=a;
      select.value=a.id;large.alt=a.title+' animation';
      root.querySelector('[data-title]').textContent=a.title;
      root.querySelector('[data-motion]').textContent=a.motion;
      root.querySelector('[data-uses]').textContent=a.uses.join(' · ');
      thumbs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===a.id)));
      play();
      if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedState:a.id,title:a.title},privateContent:null}).catch(()=>{});
    }
    select.addEventListener('change',()=>choose(select.value,true));
    root.querySelector('[data-replay]').addEventListener('click',play);
    window.addEventListener('openai:set_globals',event=>{
      const saved=event.detail?.globals?.widgetState;
      const id=saved?.modelContent?.selectedState??saved?.selectedState;
      if(id&&id!==current.id)choose(id,false);
    });
    choose(current.id,false);
  })();
  </script>
