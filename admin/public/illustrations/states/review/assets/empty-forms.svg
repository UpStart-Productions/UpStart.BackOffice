<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Forms"><title>Forms</title><style>
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes reveal{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes grow{0%{opacity:0;transform:scale(.65)}80%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1)}}
@keyframes trace{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
@keyframes turn{from{opacity:0;transform:rotate(-32deg)}to{opacity:1;transform:rotate(0)}}
@keyframes swing{0%{transform:rotate(-8deg);opacity:0}55%{transform:rotate(4deg);opacity:1}80%{transform:rotate(-1deg)}100%{transform:rotate(0);opacity:1}}
@keyframes scan{0%{transform:translate(-6px,4px);opacity:0}35%{transform:translate(2px,-2px);opacity:1}70%{transform:translate(-2px,0);opacity:1}100%{transform:translate(0,0);opacity:1}}
.appear,.rise,.slide,.reveal,.grow,.turn,.swing,.scan,.trace{animation-duration:var(--duration,650ms);animation-delay:var(--delay,0ms);animation-fill-mode:both;animation-iteration-count:1;animation-timing-function:cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
.appear{animation-name:appear}.rise{animation-name:rise}.slide{animation-name:slide}.reveal{animation-name:reveal;transform-origin:left center}.grow{animation-name:grow}.turn{animation-name:turn}.swing{animation-name:swing;transform-origin:center top}.scan{animation-name:scan}.trace{animation-name:trace;stroke-dasharray:1;stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){.appear,.rise,.slide,.reveal,.grow,.turn,.swing,.scan,.trace{animation:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style><g stroke-linecap="round" stroke-linejoin="round"><g class="appear" style="--delay:0ms;--duration:400ms"><path d="M62 169C36 144 43 113 65 98C86 84 87 54 117 45C147 35 166 56 187 51C222 42 253 61 264 87C277 117 259 138 267 162C278 195 246 216 213 212C181 208 163 220 136 210C110 200 84 191 62 169Z" fill="#EDE8FC"/></g><g class="rise" style="--delay:180ms;--duration:900ms"><path d="M116 52H194L214 72V188Q214 196 206 196H116Q108 196 108 188V60Q108 52 116 52Z" fill="#FFFFFF" stroke="#28334A" stroke-width="1.5"/><path d="M194 52V66.0Q194 72 200.0 72H214" fill="#C9D4E6" stroke="#28334A" stroke-width="1.5"/></g><path d="M125 82h48" fill="none" stroke="#7C5CE7" stroke-width="5" class="trace" style="--delay:1050ms;--duration:420ms" pathLength="1"/><g class="reveal" style="--delay:1250ms;--duration:500ms"><rect x="124" y="103" width="73" height="17" rx="4" fill="#F6F7FB" stroke="#C9D4E6" stroke-width="1.5"/></g><g class="grow" style="--delay:1650ms;--duration:400ms"><circle cx="129" cy="140" r="5" fill="#BCE5D8" stroke="#C9D4E6" stroke-width="1.5"/></g><path d="M144 140h44" fill="none" stroke="#C9D4E6" stroke-width="3" class="trace" style="--delay:1750ms;--duration:420ms" pathLength="1"/><g class="grow" style="--delay:1910ms;--duration:400ms"><circle cx="129" cy="162" r="5" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="1.5"/></g><path d="M144 162h44" fill="none" stroke="#C9D4E6" stroke-width="3" class="trace" style="--delay:2010ms;--duration:420ms" pathLength="1"/><g class="grow" style="--delay:2100ms;--duration:480ms"><path d="M264 94Q265 100 271 101Q265 102 264 108Q263 102 257 101Q263 100 264 94Z" fill="#B6A3F1" stroke="#28334A" stroke-width="1.2"/></g><g class="appear" style="--delay:1800ms;--duration:300ms"><circle cx="76" cy="161" r="3" fill="#BCE5D8"/></g></g></svg>