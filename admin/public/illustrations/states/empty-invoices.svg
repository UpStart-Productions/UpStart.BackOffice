<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="title"><title id="title">No invoices yet</title><style>
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise-back{from{transform:translateY(128px)}to{transform:translateY(0)}}
@keyframes rise-sheet{from{transform:translateY(145px)}to{transform:translateY(0)}}
@keyframes write{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes rule{from{opacity:0;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes sprig{0%{opacity:0;transform:rotate(-9deg)}75%{opacity:1;transform:rotate(2deg)}100%{opacity:1;transform:rotate(0)}}
@keyframes leaf{0%{transform:rotate(-5deg)}65%{transform:rotate(2deg)}100%{transform:rotate(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.25)}75%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes sparkle{0%{opacity:0;transform:scale(.2)}75%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
[style*="animation"]{transform-box:fill-box;transform-origin:center}
.w{transform-origin:left center!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="tray-mask" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="320" height="185"/></clipPath></defs>
