<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Your Back Office reset code</title>
<style>
  body{margin:0;padding:0;background:#FCFCFB;color:#2D2D2D;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  img{border:0;height:auto;line-height:100%;outline:none;text-decoration:none;}
  table{border-collapse:collapse!important;}
  .wrapper{width:100%;background:#FCFCFB;}
  .container{max-width:580px;margin:0 auto;}
  .brandbar{background:#667eea;border-radius:10px 10px 0 0;color:#ffffff;font-size:15px;font-weight:600;padding:14px 24px;}
  .card{background:#FEFEFD;border:1px solid #EAEAEA;border-radius:0 0 10px 10px;padding:28px;}
  .label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:6px;}
  .divider{height:1px;background:#EAEAEA;margin:14px 0 20px;}
  .code-box{background:#F4F4F2;border:1px solid #EAEAEA;border-radius:8px;padding:20px;text-align:center;}
  .code-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:8px;}
  .code{font-family:monospace;font-size:32px;font-weight:700;letter-spacing:0.12em;color:#2D2D2D;}
  .expires{font-size:12px;color:#6B6B6B;margin-top:6px;}
  .muted{font-size:13px;color:#6B6B6B;line-height:1.6;}
  .foot{font-size:12px;color:#6B6B6B;text-align:center;padding:16px 0 8px;}
</style>
</head>
<body>
<center class="wrapper">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="100%" class="container" cellpadding="0" cellspacing="0">
          <tr><td><div class="brandbar">Back Office</div></td></tr>
          <tr>
            <td class="card">
              <div class="label">Back Office</div>
              <div class="divider"></div>
              <p style="margin:0 0 12px;font-size:15px;line-height:1.6;">Hi there,</p>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">We received a request to reset your Back Office password. Use the code below:</p>
              <div class="code-box" style="margin-bottom:20px;">
                <div class="code-label">Your reset code</div>
                <div class="code">{####}</div>
                <div class="expires">Expires in 60 minutes</div>
              </div>
              <p style="margin:0;" class="muted">If you didn't request a password reset, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td class="foot">
              <a href="mailto:hello@example.com" style="color:#667eea;text-decoration:none;">hello@example.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</center>
</body>
</html>
