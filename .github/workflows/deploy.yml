name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/upstart-productions/ubo-api:${{ github.sha }}
            ghcr.io/upstart-productions/ubo-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        env:
          GHCR_PAT: ${{ secrets.EC2_GHCR }}
          GHCR_USER: ${{ github.repository_owner }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          envs: GHCR_PAT,GHCR_USER
          script: |
            set -e
            echo "→ SSH connected, changing to repo..."
            cd ${{ secrets.EC2_REPO_PATH || '/home/ubuntu/UpStart.BackOffice' }}
            echo "→ Fetching latest from origin..."
            git fetch origin
            echo "→ Resetting to origin/main..."
            git reset --hard origin/main
            echo "→ Running deploy script..."
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
            echo "→ Deploy finished."
